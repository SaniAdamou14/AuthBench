# Knobs DVC tracks for cache invalidation.
#
# These MUST mirror the Hydra configs the pipeline actually reads — the stages
# run `python -m authbench.pipeline.*`, which loads `conf/`, not this file. A
# value here that disagrees with `conf/` does not change the run; it only makes
# `dvc params diff` report something that never happened, and it did: this file
# still said `bootstrap_resamples: 1000` long after `conf/eval/default.yaml`
# moved to 2000 for the reason the README spells out (at 1000, Holm-Bonferroni
# over the 8-model catalog's 28 pairs cannot return a single significant
# result, whatever the models did).
#
# `tests/unit/test_params_match_conf.py` fails the build when the two drift.
seed: 42

dataset: lanl

# The day window `to_parquet` converts, as FIRST:LAST, or "" for all 58 days.
#
# Not a convenience knob: at full scale the pipeline needs ~81 GB of disk, and
# a laptop does not have it. Days 0:13 is ~254 million real LANL events in
# ~24 GB — see docs/scaling.md, and run `authbench preflight --events N` before
# changing it. Every number a windowed run produces describes that window, and
# `split` below must be set to match it.
to_parquet_days: "0:13"

# conf/split/temporal.yaml — must lie inside `to_parquet_days` above.
split:
  train_days: [0, 7]
  val_days: [8, 10]
  test_days: [11, 13]

# conf/features/base.yaml
features:
  f2_windows_hours: [1, 24, 168]
  f5_graph_enabled: false
  f6_sequence_enabled: false
  f6_context_length: 32
  # The wider-window run's second half — a wider partition alone still starts
  # every val/test day cold. See the comment in conf/features/base.yaml for
  # what this buys back and what it still cannot: day 0 of train has nothing
  # before the converted window to read regardless of this number.
  history_warmup_days: 2

# conf/eval/default.yaml
eval:
  budgets: [10, 50, 100, 500]
  fpr_targets: [1.0e-4, 1.0e-5]
  bootstrap_resamples: 2000
  bootstrap_confidence: 0.95
  pairwise_alpha: 0.05

# conf/config.yaml (runtime)
runtime:
  fit_sample_size: 5_000_000
  bootstrap_workers: 4

# conf/dataset/lanl.yaml
campaign_gap_hours: 24
