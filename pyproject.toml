[project]
name = "authbench"
version = "0.1.0"
description = "AuthBench — leak-free, alert-budget-constrained benchmark for authentication-log anomaly detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "AuthBench" }]

dependencies = [
    "polars>=1.9,<2.0",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "scikit-learn>=1.5",
    "numpy>=1.26,<2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "requests>=2.32",
    "psutil>=6.0",
]

[project.optional-dependencies]
classical = ["pyod>=2.0"]
deep = ["torch>=2.3"]
graph = ["networkx>=3.3", "node2vec>=0.5"]
explain = ["shap>=0.46"]
dashboard = ["streamlit>=1.37"]
tracking = ["mlflow>=2.16", "dvc>=3.55"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.112",
]
all = ["authbench[classical,deep,graph,explain,dashboard,tracking,dev]"]

[project.scripts]
authbench = "authbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# E501: line length is a formatter concern, not a lint error.
# B008: typer.Option()/typer.Argument() as argument defaults is the documented,
# idiomatic Typer pattern — not the mutable-default footgun B008 targets.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
# numpy's ndarray is generic but nearly always used unparameterized in this
# codebase (scores, feature matrices of varying dtype) — disabling just this
# one strict sub-check avoids NDArray[Any] noise on every signature without
# weakening any other strict guarantee.
disallow_any_generics = false
ignore_missing_imports = true
exclude = ["notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=authbench --cov-report=term-missing"

[tool.coverage.run]
source = ["src/authbench"]
