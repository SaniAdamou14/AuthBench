name: default

budgets: [10, 50, 100, 500]  # alerts/day
fpr_targets: [1.0e-4, 1.0e-5]

bootstrap:
  # 2000, not 1000. A percentile bootstrap cannot report a p-value below
  # 2/(R+1); Holm-Bonferroni over the catalog's 8 models (28 pairs) demands
  # 0.05/28 = 0.00179. At R=1000 the floor is 0.00200 — above the threshold,
  # so every comparison would come back non-significant by arithmetic and
  # read exactly like a real null result. See
  # `stats_tests.minimum_resamples_for_family`, which warns if this is ever
  # set too low for the number of models actually in the catalog.
  n_resamples: 10000
  # The resampling block of the positives: `account` (every campaign of one
  # account moves together; two campaigns of one account are not independent)
  # or `campaign`. Benign events are singleton blocks either way. Events inside
  # a campaign are anything but independent, so an event-level resample would
  # understate variance; anything else here is rejected rather than ignored.
  block: account
  confidence: 0.95
  seed: 42

pairwise_test:
  # The only method: the comparisons reuse the bootstrap pass above, so the
  # per-model CIs and the pairwise differences share one sampling
  # distribution. The per-event permutation test was removed on 22 October
  # 2026: it assumed events exchangeable, which campaigns are not, and it
  # needed every event's score in memory.
  method: paired_bootstrap
  alpha: 0.05
  correction: holm_bonferroni

roc_auc:
  report: true
  warn: true
  warning_message: >-
    ROC-AUC is reported for literature comparability only. At a positive rate
    near 1e-7, ROC-AUC stays high even for operationally useless models — see
    docs/limitations.md. Do not use it to rank models.
# Positives ledger (evaluate/ledger.py): per-campaign detection budgets and their summaries.
ledger:
  k_max: 10000           # upper end of the log-budget area
  n_resamples: 10000     # bootstrap over accounts
  n_simulations: 10000   # random-ranking null
  confidence: 0.95
  seed: 42
