# Strict temporal split (US-107). Never edit these bounds in code — the leakage
# guard test reads them from here and fails the pipeline if violated.
#
# `day` is `time // 86400`, i.e. 0-indexed (LANL's epoch-1 start still falls
# in day 0) — so these bounds are the 0-indexed equivalent of the spec's
# 1-58 day numbering (section 6.1): 1-30 -> 0-29, 31-40 -> 30-39, 41-58 -> 40-57.
name: temporal
mode: temporal

train_days: [0, 29]
val_days: [30, 39]
test_days: [40, 57]

regimes: [r1_unsupervised, r2_semi_supervised]
