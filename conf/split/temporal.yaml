# The wider-window split, run on rented hardware once the 8 GB reference
# machine's constraint on partition size stopped applying.
#
# The single-day split below (`train_days: [5, 5]`, `val_days: [8, 8]`,
# `test_days: [12, 12]`) is what `reports/lanl/RUN.md` reports and what an
# 8 GB machine could afford — 3.19 GB for a single 33M-row allocation is
# already the ceiling, and `docs/scaling.md` measured that one warm-up day
# (38M rows) died mid-run and two (57M) died before writing anything. This
# file's own comment used to say so at length; the constraint no longer holds
# once the run happens on a machine with enough RAM to hold the wider windows,
# so it names its own upgrade rather than repeating the old ceiling as if it
# still applied.
#
# Two things changed together, and only together — a wider window with no
# warm-up is not the fix `docs/scaling.md` recommends:
#
#  1. **Multi-day partitions**, so F2's 24-hour windows and F3's cumulative
#     pair statistics have more than a single day of same-partition events to
#     rank a "new" pair against.
#  2. **`features.history_warmup_days: 2`** (`conf/features/base.yaml`), so
#     even the *first* day of val and test — which a wider partition alone
#     does nothing for — reads real history from the two days before it. Only
#     the very first day of train (day 0) still starts cold; nothing precedes
#     the converted window for it to read.
#
# The three constraints from the single-day version still hold and were
# rechecked against the real, already-downloaded `redteam.txt.gz` before this
# file changed (never against the demo sample, and never guessed):
#
#  1. **Every partition needs campaigns**, and every one now has more than
#     before, not merely enough: train 4 -> **11**, val 45 -> **45** (day 9
#     adds events but no additional campaign_id within the 24h gap), test
#     39 -> **52** — a wider margin above
#     `stats_tests.MIN_CAMPAIGNS_FOR_SIGNIFICANCE`, and specifically more
#     campaigns for the bootstrap to resample in the partition every reported
#     confidence interval and p-value comes from.
#  2. **Temporal order holds**: [0,7] < [8,10] < [11,13].
#  3. **No partition exceeds the machine's memory**, which is no longer ~20M
#     events — it is whatever `authbench preflight` reports for the rented
#     instance, checked there before this run, not assumed here.
#
# Rows actually processed, computed from the already-converted `day=0..13`
# Parquet partitions (`data/interim/auth`, SHA-256-verified against
# `conf/dataset/lanl.yaml`, no re-download or re-conversion needed for this
# run): train scans days [0,7] (warm-up clips at 0, nothing precedes the
# converted window) = 133,093,586 rows, all written. Val scans [6,10] for
# 90,462,966 rows, writing the 51,687,105 in [8,10]. Test scans [9,13] for
# 87,003,185 rows, writing the 54,690,768 in [11,13].
#
# The gaps between partitions are still not a leak — nothing from day 6 or 9
# reaches a model as a *labeled* event — and testing on days 11-13 after
# training on days 0-7 is still a harder generalisation test than the
# immediately-following days would be.
name: temporal
mode: temporal

train_days: [0, 7]
val_days: [8, 10]
test_days: [11, 13]

regimes: [r1_unsupervised, r2_semi_supervised]
