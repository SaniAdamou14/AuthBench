# The split actually used for the LANL run: **one day per partition, and not
# contiguous**. Both properties are forced, and both must be reported.
#
# Three constraints hold simultaneously, and on LANL they admit no tidy
# thirds-of-the-calendar answer:
#
#  1. **Every partition needs campaigns.** The red team stops at day 29, and
#     inside the converted 0-13 window days 0, 3, 4, 10 and 11 carry no
#     red-team activity at all. The spec's own 0-29 / 30-39 / 40-57 leaves
#     validation and test with none — tests/unit/test_split_has_positives.py.
#  2. **Temporal order must hold**, and it does: day 5 < day 8 < day 12.
#  3. **No partition may exceed ~20M events.** Featurising 133M rows asks for a
#     single 3.19 GB allocation; 33M rows on this machine paged for 36 minutes
#     without writing a file. ~19M per split is the size measured to complete,
#     in about 2.5 minutes each.
#
# What this costs, stated plainly: **one day of history**. F2's 24-hour windows
# and F3's cumulative pair statistics have a single day of lookback inside each
# partition, so novelty and rarity are measured against a much shorter past
# than a 58-day run would give. That weakens exactly the feature families this
# benchmark says carry the lateral-movement signal, and any result must be read
# with it in mind. It is a real limitation, and a bounded, honest one.
#
# The gaps between partitions are not a leak — nothing from day 6 or 9 reaches
# the model — and evaluating on day 12 after training on day 5 is a *harder*
# test than the day immediately after, not an easier one.
#
# Campaigns: train 4, val 45, test 39. Events: 18.6M / 19.4M / 19.9M.
name: temporal
mode: temporal

train_days: [5, 5]
val_days: [8, 8]
test_days: [12, 12]

regimes: [r1_unsupervised, r2_semi_supervised]
