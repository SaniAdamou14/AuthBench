# LANL — Comprehensive, Multi-Source Cyber-Security Events (Kent, 2015)
# https://csr.lanl.gov/data/cyber1/
name: lanl

# The site gates the raw files behind a click-through data-use form (email +
# usage statement) rather than serving them at a stable static URL — see
# `ingest.download.fetch_lanl_fence_token`. `email`/`usage` are supplied via
# CLI flags or environment, never committed here.
fence:
  filenames:
    auth: auth.txt.gz
    redteam: redteam.txt.gz

# Recorded from the first verified download's own SHA-256 (LANL does not
# publish per-file checksums) — a mismatch on any later run aborts the
# pipeline (US-101), catching a corrupted or silently-changed file. Filled in
# by `authbench data download` after the first successful, size-verified run.
sha256:
  auth: null
  redteam: null

expected_rows:
  auth: 1_051_430_459
  redteam_raw: 749
  redteam_unique: 737

n_days: 58
time_resolution_seconds: 1

# auth.txt schema (9 comma-separated fields), source of truth in parse/schema.py
auth_columns:
  - time
  - src_user_at_domain
  - dst_user_at_domain
  - src_computer
  - dst_computer
  - auth_type
  - logon_type
  - auth_orientation
  - success_failure

redteam_columns:
  - time
  - user_at_domain
  - src_computer
  - dst_computer

label_join_keys: [time, user_at_domain, src_computer, dst_computer]

positive_rate_bounds: [5.0e-7, 1.0e-6]

campaign_gap_hours: 24
