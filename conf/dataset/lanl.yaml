# LANL — Comprehensive, Multi-Source Cyber-Security Events (Kent, 2015)
# https://csr.lanl.gov/data/cyber1/
name: lanl

# The site gates the raw files behind a click-through data-use form (email +
# usage statement) rather than serving them at a stable static URL — see
# `ingest.download.fetch_lanl_fence_token`. `email`/`usage` are supplied via
# CLI flags or environment, never committed here.
fence:
  filenames:
    auth: auth.txt.gz
    redteam: redteam.txt.gz

# Recorded from the first verified download's own SHA-256 (LANL does not
# publish per-file checksums) — a mismatch on any later run aborts the
# pipeline (US-101), catching a corrupted or silently-changed file. Filled in
# by `authbench data download` after the first successful, size-verified run.
sha256:
  auth: 9c6b0cc261b0edd19324f6fd1839743224938a7f644ed202ca70bd70a89bf672
  redteam: 606635837c684ad11e464075ecf97bc5df325ff7d7f64614d2d8c8af18051669

expected_rows:
  auth: 1_051_430_459
  redteam_raw: 749
  # 715, not the 737 this file used to claim. Measured on the real
  # redteam.txt.gz: 749 raw lines, 34 exact duplicates, 715 distinct. The 737
  # figure appears in secondary sources and does not survive contact with the
  # file; `parse.clean.clean_redteam` reports the count it actually removed.
  redteam_unique: 715

# The days on which the red team was active, measured from redteam.txt.gz.
#
# This is the single most consequential fact about the dataset for this
# benchmark, and it is not in the spec: **red-team activity stops at day 29.**
# The protocol's own published split (section 6.1: train 1-30, val 31-40, test
# 41-58, i.e. 0-29 / 30-39 / 40-57 here) therefore puts every one of the 749
# events in train and leaves val and test with none at all. Every ranking
# metric would be undefined, M1's weight calibration would have nothing to
# maximise, and the benchmark could not report a single number.
#
# Any split used on LANL must lie inside this range and put campaigns in all
# three partitions — `tests/unit/test_split_has_positives.py` enforces it.
redteam_active_days: [1, 29]

n_days: 58
time_resolution_seconds: 1

# auth.txt schema (9 comma-separated fields), source of truth in parse/schema.py
auth_columns:
  - time
  - src_user_at_domain
  - dst_user_at_domain
  - src_computer
  - dst_computer
  - auth_type
  - logon_type
  - auth_orientation
  - success_failure

redteam_columns:
  - time
  - user_at_domain
  - src_computer
  - dst_computer

label_join_keys: [time, user_at_domain, src_computer, dst_computer]

positive_rate_bounds: [5.0e-7, 1.0e-6]

campaign_gap_hours: 24
