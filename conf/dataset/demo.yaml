# US-103 — small synthetic sample, versioned in git, generated by
# scripts/generate_demo_data.py. Shaped like LANL but at a scale that runs
# end-to-end in well under five minutes (NFR-04).
name: demo

auth_path: data/demo/auth_demo.txt
redteam_path: data/demo/redteam_demo.txt

n_days: 14
time_resolution_seconds: 1

auth_columns:
  - time
  - src_user_at_domain
  - dst_user_at_domain
  - src_computer
  - dst_computer
  - auth_type
  - logon_type
  - auth_orientation
  - success_failure

redteam_columns:
  - time
  - user_at_domain
  - src_computer
  - dst_computer

label_join_keys: [time, user_at_domain, src_computer, dst_computer]

# Wide bounds — the demo's exact positive rate depends on the generator's
# random parameters and is not meant to match LANL's.
positive_rate_bounds: [1.0e-6, 1.0e-2]

campaign_gap_hours: 24
