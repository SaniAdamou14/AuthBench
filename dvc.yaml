stages:
  # Requires AUTHBENCH_LANL_EMAIL in the environment: LANL serves the raw
  # files behind a click-through data-use form, not a static URL, and an
  # address does not belong in a committed pipeline definition.
  #
  # `cache: false` on every large output below is a disk decision, not a
  # correctness one. DVC's default is to copy each output into `.dvc/cache`,
  # and on Windows reflinks and hardlinks are off by default — so a cached
  # 5 GB `data/raw` and a cached ~15 GB `data/interim/auth` cost that much
  # again. These are reproducible from `download` + `to_parquet` and verified
  # by SHA-256 and an exact row count; keeping a second copy buys nothing and
  # is the difference between the pipeline fitting on a laptop disk and not.
  # If you have the space and want the cache back, drop the `cache: false`
  # lines and run `dvc config cache.type hardlink,symlink,copy` first.
  download:
    cmd: authbench data download --dataset ${dataset}
    params:
      - dataset
    outs:
      - data/raw:
          persist: true
          cache: false

  # No --overwrite: DVC deletes this stage's non-persistent output before running it, so the
  # directory is empty, and adding the flag would change the command dvc.lock records.
  to_parquet:
    cmd: >-
      authbench data to-parquet data/raw/auth.txt.gz
      --out-dir data/interim/auth
      --dataset ${dataset}
      --days "${to_parquet_days}"
    deps:
      - data/raw
    params:
      - dataset
      - to_parquet_days
    outs:
      - data/interim/auth:
          cache: false

  label_split_features:
    cmd: python -m authbench.pipeline.build_features
    deps:
      - data/interim/auth
      # The labels come straight from the raw redteam.txt.gz, not from the
      # Parquet dataset — without this dep a re-downloaded redteam file would
      # never re-trigger labeling.
      - data/raw
      - src/authbench/label
      - src/authbench/split
      - src/authbench/features
      # The stage reads conf/, not params.yaml. Depending on the files it
      # actually loads is what makes a config edit invalidate the stage;
      # params.yaml only mirrors them for `dvc params diff`.
      - conf/split/temporal.yaml
      - conf/features/base.yaml
      - conf/dataset/lanl.yaml
    params:
      - split
      - features
    outs:
      - data/processed/features:
          cache: false

  train_eval:
    cmd: python -m authbench.pipeline.train_eval
    deps:
      - data/processed/features
      - src/authbench/models
      - src/authbench/evaluate
      - conf/eval/default.yaml
    params:
      - seed
      - eval
    outs:
      - reports/tables
      - reports/figures
    # The metrics file sits *outside* reports/tables on purpose. DVC refuses a
    # metric that lives inside a tracked output directory ("overlap and are
    # thus in the same tracked directory"), so a metric under reports/tables/
    # makes `dvc repro` fail before it runs anything.
    metrics:
      - reports/metrics_summary.json:
          cache: false

# This pipeline describes the default two-week temporal configuration of params.yaml; it is
# not how the paper's run was produced. That run is `scripts/run_lanl.sh` (both protocols,
# deep models and Euler), recorded in reports/runs/<run>/RUN.md, and the paper is built from
# its committed outputs by `scripts/paper_assets.py` and latexmk, outside DVC.
